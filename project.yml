name: Bookscroll
options:
  bundleIdPrefix: app.bookscroll
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  # Readable by Xcode 15.x (objectVersion 60); newer Xcode versions open it too.
  projectFormat: xcode15_0
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: "0.9.19"

targets:
  Bookscroll:
    type: application
    platform: iOS
    sources:
      - path: Bookscroll
    dependencies:
      - package: ZIPFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.bookscroll.Bookscroll
        PRODUCT_NAME: Bookscroll
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        # Document types (EPUB, PDF) for "Open in Bookscroll"; Xcode merges the generated keys into it.
        INFOPLIST_FILE: Support/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Bookscroll
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
    scheme:
      testTargets:
        - BookscrollTests
        - BookscrollUITests
      gatherCoverageData: false

  BookscrollTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BookscrollTests
    dependencies:
      - target: Bookscroll
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.bookscroll.BookscrollTests
        GENERATE_INFOPLIST_FILE: YES

  BookscrollUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: BookscrollUITests
    dependencies:
      - target: Bookscroll
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.bookscroll.BookscrollUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Bookscroll
